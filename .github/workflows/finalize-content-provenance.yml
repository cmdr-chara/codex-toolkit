name: Finalize Content Provenance Integration

on:
  push:
    branches: ["feat/content-provenance-hygiene"]

permissions:
  actions: read
  contents: write
  pull-requests: write

jobs:
  finalize:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Check out feature branch
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: feat/content-provenance-hygiene
          fetch-depth: 0

      - name: Synchronize with any preview bootstrap commit
        run: |
          sleep 20
          git fetch origin feat/content-provenance-hygiene
          git reset --hard origin/feat/content-provenance-hygiene

      - name: Verify target pull request
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          test "$(gh pr view 4 --repo "$GITHUB_REPOSITORY" --json headRefName --jq .headRefName)" = "feat/content-provenance-hygiene"
          test "$(gh pr view 4 --repo "$GITHUB_REPOSITORY" --json baseRefName --jq .baseRefName)" = "main"

      - name: Render social preview
        run: |
          python -m pip install --disable-pip-version-check pillow
          python scripts/render_social_preview.py

      - name: Run local release and structural gates
        run: |
          set -euo pipefail
          python scripts/validate_skill_pack.py
          python scripts/verify_anti_slop_vendor.py
          python scripts/test_typescript_quality_regressions.py
          python scripts/verify_release_metadata.py
          python scripts/run_smoke_tests.py
          npm pack --dry-run >/dev/null

      - name: Remove bootstrap workflows and commit generated preview
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git rm -f .github/workflows/finalize-content-provenance.yml
          if [ -e .github/workflows/bootstrap-social-preview.yml ]; then
            git rm -f .github/workflows/bootstrap-social-preview.yml
          fi
          git add .github/assets/codex-toolkit-social-preview.png \
                  .github/assets/codex-toolkit-social-preview.manifest.json
          if git diff --cached --quiet; then
            echo "No finalization changes to commit."
          else
            git commit -m "chore: finalize content provenance integration"
            git push origin HEAD:feat/content-provenance-hygiene
          fi

      - name: Wait for official CI on final head
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          head_sha="$(git rev-parse HEAD)"
          echo "Final head: $head_sha"
          for attempt in $(seq 1 80); do
            payload="$(gh api "repos/$GITHUB_REPOSITORY/actions/workflows/ci.yml/runs?head_sha=$head_sha&event=pull_request&per_page=1")"
            count="$(printf '%s' "$payload" | jq '.workflow_runs | length')"
            if [ "$count" -eq 0 ]; then
              sleep 5
              continue
            fi
            status="$(printf '%s' "$payload" | jq -r '.workflow_runs[0].status')"
            conclusion="$(printf '%s' "$payload" | jq -r '.workflow_runs[0].conclusion // ""')"
            echo "CI: status=$status conclusion=$conclusion"
            if [ "$status" = "completed" ]; then
              test "$conclusion" = "success"
              exit 0
            fi
            sleep 5
          done
          echo "Timed out waiting for CI" >&2
          exit 1

      - name: Squash merge PR 4
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          head_sha="$(git rev-parse HEAD)"
          gh pr merge 4 --repo "$GITHUB_REPOSITORY" --squash --match-head-commit "$head_sha" --delete-branch
