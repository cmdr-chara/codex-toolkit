name: Reusable Auto Release

on:
  workflow_call:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  release:
    if: github.ref_name == github.event.repository.default_branch && github.event.repository.fork == false
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Check out repository
        uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - name: Detect repository version
        id: version
        shell: bash
        run: |
          python3 - <<'PY'
          from __future__ import annotations

          import json
          import os
          import re
          import tomllib
          import xml.etree.ElementTree as ET
          from pathlib import Path

          root = Path('.')
          version = None
          source = None

          def accept(value, origin):
              global version, source
              if version is None and isinstance(value, str) and value.strip():
                  version = value.strip()
                  source = origin

          package = root / 'package.json'
          if package.is_file():
              try:
                  data = json.loads(package.read_text(encoding='utf-8'))
                  if isinstance(data, dict):
                      accept(data.get('version'), 'package.json')
              except (OSError, UnicodeError, json.JSONDecodeError):
                  pass

          pyproject = root / 'pyproject.toml'
          if version is None and pyproject.is_file():
              try:
                  data = tomllib.loads(pyproject.read_text(encoding='utf-8'))
                  project = data.get('project', {}) if isinstance(data, dict) else {}
                  if isinstance(project, dict):
                      accept(project.get('version'), 'pyproject.toml:[project]')
                  tool = data.get('tool', {}) if isinstance(data, dict) else {}
                  poetry = tool.get('poetry', {}) if isinstance(tool, dict) else {}
                  if isinstance(poetry, dict):
                      accept(poetry.get('version'), 'pyproject.toml:[tool.poetry]')
              except (OSError, UnicodeError, tomllib.TOMLDecodeError):
                  pass

          for filename, section in (('Cargo.toml', 'package'), ('Project.toml', None)):
              path = root / filename
              if version is not None or not path.is_file():
                  continue
              try:
                  data = tomllib.loads(path.read_text(encoding='utf-8'))
                  if section is None:
                      accept(data.get('version') if isinstance(data, dict) else None, filename)
                  else:
                      block = data.get(section, {}) if isinstance(data, dict) else {}
                      if isinstance(block, dict):
                          accept(block.get('version'), f'{filename}:[{section}]')
              except (OSError, UnicodeError, tomllib.TOMLDecodeError):
                  pass

          pubspec = root / 'pubspec.yaml'
          if version is None and pubspec.is_file():
              try:
                  match = re.search(r'(?m)^version:\s*([^\s+#]+)', pubspec.read_text(encoding='utf-8'))
                  if match:
                      accept(match.group(1), 'pubspec.yaml')
              except (OSError, UnicodeError):
                  pass

          gradle = root / 'gradle.properties'
          if version is None and gradle.is_file():
              try:
                  match = re.search(r'(?m)^version\s*=\s*(\S+)\s*$', gradle.read_text(encoding='utf-8'))
                  if match:
                      accept(match.group(1), 'gradle.properties')
              except (OSError, UnicodeError):
                  pass

          pom = root / 'pom.xml'
          if version is None and pom.is_file():
              try:
                  tree = ET.parse(pom)
                  project = tree.getroot()
                  for child in project:
                      if child.tag.rsplit('}', 1)[-1] == 'version' and child.text:
                          accept(child.text, 'pom.xml')
                          break
              except (OSError, ET.ParseError):
                  pass

          if version is None:
              projects = sorted(root.glob('*.csproj'))
              if len(projects) == 1:
                  try:
                      tree = ET.parse(projects[0])
                      for element in tree.iter():
                          if element.tag.rsplit('}', 1)[-1] in {'Version', 'VersionPrefix'} and element.text:
                              accept(element.text, projects[0].name)
                              break
                  except (OSError, ET.ParseError):
                      pass

          for filename in ('VERSION', 'VERSION.txt', 'version.txt'):
              path = root / filename
              if version is None and path.is_file():
                  try:
                      accept(path.read_text(encoding='utf-8').strip().splitlines()[0], filename)
                  except (OSError, UnicodeError, IndexError):
                      pass

          output = Path(os.environ['GITHUB_OUTPUT'])
          if version is None:
              with output.open('a', encoding='utf-8') as handle:
                  handle.write('found=false\n')
              print('No supported root version source found; no release will be created.')
              raise SystemExit(0)

          normalized = version.removeprefix('v')
          if not re.fullmatch(r'[0-9]+(?:\.[0-9]+){1,3}(?:[-+][0-9A-Za-z.-]+)?', normalized):
              raise SystemExit(f'Unsupported release version {version!r} from {source}')

          tag = f'v{normalized}'
          with output.open('a', encoding='utf-8') as handle:
              handle.write('found=true\n')
              handle.write(f'version={normalized}\n')
              handle.write(f'tag={tag}\n')
              handle.write(f'source={source}\n')
          print(f'Detected {tag} from {source}.')
          PY

      - name: Create tag and GitHub release
        if: steps.version.outputs.found == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ steps.version.outputs.tag }}
        shell: bash
        run: |
          set -euo pipefail

          if gh release view "$RELEASE_TAG" >/dev/null 2>&1; then
            echo "Release $RELEASE_TAG already exists; nothing to do."
            exit 0
          fi

          if ! git ls-remote --exit-code --tags origin "refs/tags/$RELEASE_TAG" >/dev/null 2>&1; then
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git tag -a "$RELEASE_TAG" "$GITHUB_SHA" -m "Release $RELEASE_TAG"
            git push origin "$RELEASE_TAG"
          fi

          gh release create "$RELEASE_TAG" \
            --verify-tag \
            --generate-notes \
            --title "${{ github.event.repository.name }} $RELEASE_TAG"
